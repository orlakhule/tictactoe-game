[build]
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = false

# SPA fallback: serve index.html for any unmatched route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "0"
